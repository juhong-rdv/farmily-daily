# 우리 지역 날씨(기상청)와 KAMIS 시세를 받아 저장소에 커밋합니다.
# 필요 Secrets: KMA_SERVICE_KEY, KAMIS_CERT_KEY, KAMIS_CERT_ID  (없으면 해당 단계는 건너뜀)
name: farmily-data
on:
  schedule:
    - cron: "20 20 * * *"   # 05:20 KST — 아침 게시(06:35) 전에 05시 단기예보 반영
    - cron: "20 2 * * *"    # 11:20 KST — 11시 예보 + 오전 KAMIS
    - cron: "20 8 * * *"    # 17:20 KST — 17시 예보 + 당일 KAMIS
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
concurrency:
  group: farmily-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: 기상청 단기·중기예보, ASOS 일조
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: python scripts/fetch_weather.py
        continue-on-error: true
      - name: KAMIS 도매가격
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
        run: python scripts/fetch_kamis.py
        continue-on-error: true
      - name: 커밋
        run: |
          git config user.name "farmily-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in data kamis-prices.json archive-kamis; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "기상·KAMIS 데이터 자동 갱신 ($(TZ=Asia/Seoul date '+%m/%d %H:%M'))"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Pages 다시 빌드 요청
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
